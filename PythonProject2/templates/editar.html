<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash{{category}}">{{message}}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

    <form action="{{url_for('editar', id=livro[0])}}" method="post">
      <label for="titulo">Título:</label>
      <input type="text" id="titulo" name="nome" value="{{livro[1]}}" required>

      <label for="autor">Autor:</label>
      <input type="text" id="autor" name="autor" value="{{livro[2]}}"  required>

      <label for="ano">Ano de Publicação</label>
      <input type="number" id="ano" name="ano" value="{{livro[3]}}"  required>

      <div class="style">
        <button type="submit">Salvar</button>
      </div>

  </form>

</body>
</html>
