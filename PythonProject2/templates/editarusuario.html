<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuário</title>
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flash-messages">
            {% for category, message in messages %}
                <div class="flash{{category}}">{{message}}</div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<form action="{{url_for('editarusuario', id=usuario[0])}}" method="post">

    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" value="{{usuario[1]}}" required>

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" value="{{usuario[2]}}" required>

    <label for="senha">Senha:</label>
    <input type="text" id="senha" name="senha" value="{{usuario[3]}}" required>

    <div class="style">
        <button type="submit">Salvar</button>
    </div>

</form>

</body>
</html>
